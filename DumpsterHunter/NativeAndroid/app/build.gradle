plugins {
    id 'com.android.application'
}

android {
    namespace 'com.dumphunter.demo'
    compileSdk 36

    defaultConfig {
        applicationId 'com.dumphunter.demo'
        minSdk 26
        targetSdk 36
        versionCode 25
        versionName '0.3.0'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.debug
        }
    }

    packaging {
        jniLibs { useLegacyPackaging true }
    }
}

dependencies {
    implementation 'androidx.annotation:annotation:1.9.1'
    implementation 'androidx.media3:media3-exoplayer:1.10.1'
    implementation 'androidx.media3:media3-exoplayer-rtsp:1.10.1'
    implementation files('libs/ijkplayer-java-0.8.8.aar')
    implementation files('libs/ijkplayer-arm64-0.8.8.aar')
}
